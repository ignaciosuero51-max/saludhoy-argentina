<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Transferencia</title>
<style>body{font-family:system-ui;padding:40px;background:#fff}button{font-size:26px;padding:24px 48px;background:#6d388b;color:#fff;border:0;border-radius:12px}#log{margin-top:20px;font-size:14px;color:#444;white-space:pre}</style></head>
<body><button id="dl">DESCARGAR (0)</button><div id="log"></div>
<script>
const items=[];const log=document.getElementById('log'),btn=document.getElementById('dl');
window.addEventListener('message',e=>{if(!e.data||e.data.t!=='img')return;items.push([e.data.name,e.data.buf]);btn.textContent='DESCARGAR ('+items.length+')';log.textContent+=e.data.name+' '+e.data.buf.byteLength+'\n';if(e.source)e.source.postMessage({t:'ack',name:e.data.name},'*')});
btn.onclick=()=>{const parts=[];const enc=new TextEncoder();for(const [name,buf] of items){const h=new Uint8Array(512);const put=(s,o,l)=>{const b=enc.encode(s);h.set(b.subarray(0,l),o)};put(name,0,100);put('0000644\0',100,8);put('0000000\0',108,8);put('0000000\0',116,8);put(buf.byteLength.toString(8).padStart(11,'0')+'\0',124,12);put(Math.floor(Date.now()/1000).toString(8).padStart(11,'0')+'\0',136,12);put('        ',148,8);put('0',156,1);put('ustar\0',257,6);put('00',263,2);let sum=0;for(let i=0;i<512;i++)sum+=h[i];put(sum.toString(8).padStart(6,'0')+'\0 ',148,8);parts.push(h,new Uint8Array(buf));const pad=(512-buf.byteLength%512)%512;if(pad)parts.push(new Uint8Array(pad))}parts.push(new Uint8Array(1024));const blob=new Blob(parts,{type:'application/x-tar'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bx-adv-portadas.tar';document.body.appendChild(a);a.click();btn.textContent='LISTO'};
</script></body></html>
